name: Build-OLLVM-8

on:
  push:
    branches: [llvm-8.0]   # 你放源码的分支
  workflow_dispatch:       # 手动触发也行

jobs:
  build:
    runs-on: ubuntu-20.04   # 20.04 自带 cmake-3.16 ninja
    steps:
      - uses: actions/checkout@v3
        with:
          ref: llvm-8.0     # 拉 heroims 的已补丁源码

      - name: deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build build-essential

      - name: configure & build
        run: |
          mkdir build && cd build
          cmake -G Ninja .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_ENABLE_PROJECTS="clang;lld" \
            -DLLVM_TARGETS_TO_BUILD="ARM;AArch64;X86" \
            -DCMAKE_INSTALL_PREFIX=./install
          ninja -j$(nproc)
          ninja install

      - name: pack
        run: |
          cd build/install
          tar -Jcf ../../ollvm-8.0-linux-x86_64.tar.xz *

      - name: upload to Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v8.0-ci
          files: ollvm-8.0-linux-x86_64.tar.xz
          title: OLLVM-8.0 auto build
