name: Build-OLLVM-8

on:
  push:
    branches: [llvm-9.0.1]   # 你 fork 里放源码的分支
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # ① 检出代码
      - uses: actions/checkout@v4

      # ② 安装依赖
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build build-essential

      # ③ 缓存构建目录
      - name: Cache LLVM build
        uses: actions/cache@v3
        with:
          path: |
            build
            install
          key: ${{ runner.os }}-llvm-8.0-${{ hashFiles('**/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-llvm-8.0-

      # ④ 配置 + 编译
      - name: Configure & Build
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DLLVM_TARGETS_TO_BUILD="ARM;AArch64;X86" \
            -DLLVM_BUILD_TOOLS=ON \
            -DLLVM_BUILD_EXAMPLES=OFF \
            -DLLVM_BUILD_TESTS=OFF \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_INCLUDE_EXAMPLES=OFF \
            -DCMAKE_CXX_FLAGS="-Wno-error" \
            -DCMAKE_INSTALL_PREFIX="$PWD/install"
          cmake --build build --parallel $(nproc)

      # ⑤ 安装
      - name: Install
        run: cmake --install build

      # ⑥ 打包
      - name: Pack
        run: |
          cd install
          tar -Jcf ../ollvm-8.0-linux-x86_64.tar.xz *

      # ⑦ 发布到 Release
      - name: Upload Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v8.0-ci-linux
          files: ollvm-8.0-linux-x86_64.tar.xz
          title: OLLVM-8.0 Linux Build
