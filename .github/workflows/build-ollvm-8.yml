name: Build-OLLVM-8

on:
  push:
    branches: [llvm-8.0]   # 你 fork 里放源码的分支
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # ① 用 v4 检出你 fork 的同名分支
      - uses: actions/checkout@v4

      # ② 把 clang 目录放进 llvm/tools/clang（heroims 仓库布局需要）
      - name: Move clang into LLVM tree
        run: |
          mv clang tools/clang

      # ③ 装依赖
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build build-essential

      # ④ 配置 + 编译
      - name: Configure & Build
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_ENABLE_PROJECTS="clang;lld" \
            -DLLVM_TARGETS_TO_BUILD="ARM;AArch64;X86" \
            -DCMAKE_INSTALL_PREFIX="$PWD/install"
          cmake --build build --parallel "$(nproc)"

      # ⑤ 安装
      - name: Install
        run: cmake --install build

      # ⑥ 打包
      - name: Pack
        run: |
          cd install
          tar -Jcf ../ollvm-8.0-linux-x86_64.tar.xz *

      # ⑦ 发布到 Release
      - name: Upload Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v8.0-ci
          files: ollvm-8.0-linux-x86_64.tar.xz
          title: OLLVM-8.0 auto build
