name: Build-OLLVM-8

on:
  push:
    branches: [llvm-8.0]   # 你 fork 里放源码的分支
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      # ① 检出代码
      - uses: actions/checkout@v4

      # ② 安装依赖
      - name: Install deps
        run: |
          choco install cmake ninja -y

      # ③ 设置 MSVC 环境
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # ④ 配置 + 编译
      - name: Configure & Build
        shell: cmd
        run: |
          cmake -B build -G Ninja ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DLLVM_ENABLE_PROJECTS=clang;lld ^
            -DLLVM_TARGETS_TO_BUILD=ARM;AArch64;X86 ^
            -DCMAKE_INSTALL_PREFIX=%CD%\install
          cmake --build build --parallel %NUMBER_OF_PROCESSORS%

      # ⑤ 安装
      - name: Install
        run: cmake --install build

      # ⑥ 打包
      - name: Pack
        shell: pwsh
        run: |
          Compress-Archive -Path install\* -DestinationPath ollvm-8.0-windows-x86_64.zip

      # ⑦ 发布到 Release
      - name: Upload Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v8.0-ci-windows
          files: ollvm-8.0-windows-x86_64.zip
          title: OLLVM-8.0 Windows Build
