name: Build-OLLVM-8

on:
  push:
    branches: [llvm-8.0]   # 你 fork 里放源码的分支
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      # ① 检出代码
      - uses: actions/checkout@v4

      # ② 安装依赖
      - name: Install deps
        run: |
          choco install cmake ninja -y

      # ③ 缓存构建目录
      - name: Cache LLVM build
        uses: actions/cache@v3
        with:
          path: |
            build
            install
          key: ${{ runner.os }}-llvm-8.0-${{ hashFiles('**/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-llvm-8.0-

      # ④ 设置 MSVC 环境
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # ⑤ 配置 + 编译
      - name: Configure & Build
        shell: cmd
        run: |
          cmake -B build -G Ninja ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 ^
            -DLLVM_TARGETS_TO_BUILD=ARM;AArch64;X86 ^
            -DCMAKE_INSTALL_PREFIX=%CD%\install
          cmake --build build --parallel %NUMBER_OF_PROCESSORS%

      # ⑥ 安装
      - name: Install
        run: cmake --install build

      # ⑦ 打包
      - name: Pack
        shell: pwsh
        run: |
          Compress-Archive -Path install\* -DestinationPath ollvm-8.0-windows-x86_64.zip

      # ⑧ 发布到 Release
      - name: Upload Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v8.0-ci-windows
          files: ollvm-8.0-windows-x86_64.zip
          title: OLLVM-8.0 Windows Build
